# AC-13.1: the optional root `variables` bucket carries one YAML anchor per
# Factory default role; client configuration reuses them through aliases. The
# YAML loader resolves the aliases before the reference parser sees the values.
specVersion: "0.1"
variables:
  worker: &worker_model
    provider: router
    model: primary
  thinker: &thinker_model
    provider: router
    model: primary
  orchestrator: &orchestrator_model
    provider: router
    model: primary
  simple: &simple_model
    provider: router
    model: primary
  validator: &validator_model
    provider: router
    model: primary
providers:
  router:
    name: Router
    targets: [factory]
    baseUrl: https://router.example/v1
    apiKey: env.ROUTER_KEY
    provider: openai
    enabled: true
    models:
      primary:
        displayName: Primary
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
clientConfig:
  factory:
    core:
      defaults:
        worker: *worker_model
        thinker: *thinker_model
        orchestrator: *orchestrator_model
        simple: *simple_model
        validator: *validator_model
      session:
        model: *worker_model
        reasoningEffort: high
        specModeModel: *thinker_model
        specModeReasoningEffort: max
      mission:
        orchestratorModel: *orchestrator_model
        orchestratorReasoningEffort: max
        workerModel: *worker_model
        workerReasoningEffort: high
        validationWorkerModel: *validator_model
        validationWorkerReasoningEffort: max
      subagent:
        lightModel: *worker_model
        mediumModel: *worker_model
        heavyModel: *thinker_model
