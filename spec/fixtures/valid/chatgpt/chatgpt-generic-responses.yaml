specVersion: "0.1"
providers:
  openrouter:
    name: OpenRouter
    targets: [factory, chatgpt]
    baseUrl: https://openrouter.ai/api/v1
    apiKey: env.OPENROUTER_API_KEY
    provider: generic-chat-completion-api
    enabled: true
    extensions:
      chatgpt:
        wireApi: responses
        default: true
    models:
      gpt-5-mini:
        displayName: GPT-5.6 Sol
        contextWindow: 1048576
        maxOutputTokens: 128000
        enabled: true
