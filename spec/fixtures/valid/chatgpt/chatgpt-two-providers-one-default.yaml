# Two emitting ChatGPT providers require exactly one default.
specVersion: "0.1"
providers:
  openrouter:
    name: OpenRouter
    targets: [chatgpt]
    baseUrl: https://openrouter.example/v1
    apiKey: env.OPEN_ROUTER_API_KEY
    provider: generic-chat-completion-api
    enabled: true
    extensions:
      chatgpt:
        wireApi: responses
        default: true
    models:
      gpt-5-mini:
        displayName: GPT-5 Mini
        contextWindow: 1000000
        maxOutputTokens: 64000
        enabled: true
  openai:
    name: OpenAI
    targets: [chatgpt]
    baseUrl: https://api.openai.com/v1
    apiKey: env.OPENAI_API_KEY
    provider: openai
    enabled: true
    models:
      router-sol:
        displayName: GPT-5 Mini
        contextWindow: 1000000
        maxOutputTokens: 64000
        enabled: true
