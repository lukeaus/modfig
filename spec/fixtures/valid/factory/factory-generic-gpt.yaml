# VAL-CATALOG-006: a GPT-family model under a generic-chat-completion-api
# provider (OpenRouter-style) validates; no static name-based transport rule
# rejects it. The computed Factory id is custom:gpt-5--openrouter.
specVersion: "0.1"
providers:
  openrouter:
    name: OpenRouter
    targets: [factory]
    baseUrl: https://openrouter.example/v1
    apiKey: env.OPENROUTER_API_KEY
    enabled: true
    models:
      gpt-5:
        displayName: GPT-5.6 Terra
        contextWindow: 1048576
        maxOutputTokens: 128000
        enabled: true
        favourite: true
