# VAL-CATALOG-006: a GPT-family model under a generic-chat-completion-api
# provider (Surplus-style) validates; no static name-based transport rule
# rejects it. The computed Factory id is custom:gpt-5.6-terra--surplus.
specVersion: "0.1"
providers:
  surplus:
    name: Surplus
    targets: [factory]
    baseUrl: https://surplus.example/v1
    apiKey: env.SURPLUS_API_KEY
    enabled: true
    models:
      gpt-5.6-terra:
        displayName: GPT-5.6 Terra
        contextWindow: 1048576
        maxOutputTokens: 128000
        enabled: true
        favourite: true
