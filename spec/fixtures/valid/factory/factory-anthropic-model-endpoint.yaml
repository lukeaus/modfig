# VAL-ENDPOINT-001: an Anthropic-transport model under a multi-endpoint
# provider (OpenRouter-style) validates with a per-model baseUrl override;
# the override feeds Factory custom model endpoints and VS Code model URLs.
# Without the override, the provider baseUrl applies.
specVersion: "0.1"
providers:
  openrouter:
    name: OpenRouter
    targets: [factory, vscode]
    baseUrl: https://openrouter.ai/api/v1
    apiKey: env.OPENROUTER_API_KEY
    provider: anthropic
    enabled: true
    models:
      claude-sonnet-5:
        displayName: Claude Sonnet 5
        contextWindow: 1048576
        maxOutputTokens: 128000
        baseUrl: https://openrouter.ai/api/v1/anthropic
        enabled: true
      claude-opus-4-5:
        displayName: GPT-4o mini
        contextWindow: 1048576
        maxOutputTokens: 128000
        enabled: true
