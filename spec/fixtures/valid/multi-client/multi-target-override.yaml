# AC-13.1 / AC-3.12 / AC-4.2 / AC-4.3: multi-target registry with a model-level
# provider override (OpenRouter aggregator brand) and per-target id overrides.
# Factory ids are computed (custom:<slug>--<provider-key>); the stored
# extensions.factory.id namespace is removed.
specVersion: "0.1"
providers:
  openrouter:
    name: OpenRouter
    targets: [factory, vscode]
    baseUrl: https://openrouter.ai/api/v1
    apiKey: env.OPENROUTER_API_KEY
    provider: generic-chat-completion-api
    enabled: true
    models:
      "deepseek/deepseek-v4-pro":
        displayName: DeepSeek V4 Pro [OpenRouter]
        contextWindow: 131072
        maxOutputTokens: 32768
        provider: OpenRouter
        enabled: true
        extensions:
          vscode:
            id: deepseek-v4-pro
