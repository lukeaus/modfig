specVersion: "0.1"
providers:
  first:
    name: First
    targets: [chatgpt]
    baseUrl: https://first.example/v1
    apiKey: env.FIRST_KEY
    provider: openai
    enabled: true
    models:
      first-model:
        displayName: First Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
        extensions:
          chatgpt: {catalogId: shared-model}
  second:
    name: Second
    targets: [chatgpt]
    baseUrl: https://second.example/v1
    apiKey: env.SECOND_KEY
    provider: openai
    enabled: true
    models:
      second-model:
        displayName: Second Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
        extensions:
          chatgpt: {catalogId: shared-model}
