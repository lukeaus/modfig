specVersion: "0.1"
providers:
  open.router:
    name: Open Router
    targets: [chatgpt]
    baseUrl: https://openrouter.ai/api/v1
    apiKey: env.OPEN_ROUTER_API_KEY
    provider: openai
    enabled: true
    extensions:
      chatgpt:
        default: true
    models:
      router-model:
        displayName: Router Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
