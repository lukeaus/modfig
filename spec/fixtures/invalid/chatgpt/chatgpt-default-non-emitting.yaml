specVersion: "0.1"
providers:
  factory-only:
    name: Factory Only
    targets: [factory]
    baseUrl: https://factory.example/v1
    apiKey: env.FACTORY_KEY
    provider: openai
    enabled: true
    extensions:
      chatgpt:
        default: true
    models:
      factory-model:
        displayName: Factory Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
  openrouter:
    name: OpenRouter
    targets: [chatgpt]
    baseUrl: https://openrouter.example/v1
    apiKey: env.OPEN_ROUTER_API_KEY
    provider: openai
    enabled: true
    extensions:
      chatgpt:
        default: true
    models:
      openrouter-model:
        displayName: OpenRouter Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
