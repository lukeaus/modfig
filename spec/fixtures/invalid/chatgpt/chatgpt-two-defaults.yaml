specVersion: "0.1"
providers:
  openrouter:
    name: OpenRouter
    targets: [chatgpt]
    baseUrl: https://openrouter.example/v1
    apiKey: env.OPEN_ROUTER_API_KEY
    provider: openai
    enabled: true
    extensions:
      chatgpt:
        default: true
    models:
      openrouter-model:
        displayName: OpenRouter Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
  openrouter:
    name: OpenRouter
    targets: [chatgpt]
    baseUrl: https://openrouter.ai/api/v1
    apiKey: env.OPEN_ROUTER_API_KEY
    provider: openai
    enabled: true
    extensions:
      chatgpt:
        default: true
    models:
      router-model:
        displayName: Router Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: true
