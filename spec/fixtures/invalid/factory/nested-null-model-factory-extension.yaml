# VAL-CATALOG-004: the model-level extensions.factory namespace is removed;
# declaring it is rejected as an unknown field.
specVersion: "0.1"
providers:
  nested-null:
    name: Nested Null
    targets: [factory]
    baseUrl: https://example.com/v1
    apiKey: env.API_KEY
    enabled: false
    models:
      model:
        displayName: Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: false
        extensions:
          factory: null
