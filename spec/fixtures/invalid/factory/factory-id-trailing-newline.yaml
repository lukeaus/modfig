# VAL-CATALOG-004: the model-level extensions.factory namespace is removed.
specVersion: "0.1"
providers:
  trailing-factory-id:
    name: Trailing Factory Id
    targets: [factory]
    baseUrl: https://example.com/v1
    apiKey: env.API_KEY
    enabled: false
    models:
      model:
        displayName: Model
        contextWindow: 8192
        maxOutputTokens: 1024
        enabled: false
        extensions:
          factory:
            id: custom:model--provider
