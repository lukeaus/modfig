[build-system]
requires = ["setuptools>=83", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "modfig"
dynamic = ["version"]
description = "Versioned model configuration synchronization for Factory Droid and VS Code"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Luke Scott"}]
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=48.0.1,<51",
    "jsonschema>=4.23,<5",
    "tomlkit>=0.13,<0.16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff==0.16.4",
    "pytest>=8.0",
    "build>=1.2",
    "types-PyYAML>=6.0",
    "commitizen==4.18.0",
    "pre-commit>=4,<5",
]

[project.scripts]
modfig = "modfig.cli:main"

[tool.commitizen]
name = "cz_conventional_commits"
allowed_prefixes = ["Merge", "Revert", "Pull request", "fixup!", "squash!", "amend!"]
breaking_change_exclamation_in_title = false

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
version_source = "tag"
allow_zero_version = true
major_on_zero = false
build_command = "python -m build --sdist --wheel ."
commit_message = "chore: release v{version}"
commit = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
ignore_merge_commits = true
parse_squash_commits = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.setuptools.package-data]
"modfig.resources" = ["spec/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/modfig"]
