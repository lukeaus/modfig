[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "modfig"
version = "0.1.0"
description = "Versioned model configuration synchronization for Factory Droid and VS Code"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Luke Scott"}]
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=48.0.1,<51",
    "jsonschema>=4.23,<5",
    "tomlkit>=0.13,<0.16",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff==0.16.2", "pytest>=8.0", "build>=1.2", "types-PyYAML>=6.0"]

[project.scripts]
modfig = "modfig.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"modfig.resources" = ["spec/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/modfig"]
